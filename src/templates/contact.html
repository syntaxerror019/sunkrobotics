{% extends "base.html" %}

{% block content %}

<!-- Contact Section -->
<section class="py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="fw-bold display-6">Let’s Talk!</h2>
      <p class="lead text-muted">
        Have questions? We’d love to hear from you! <br>
        Feel free to email us at 
        <a href="mailto:sunkroboticsteam@gmail.com" class="text-decoration-none fw-semibold">sunkroboticsteam@gmail.com</a>.<br>
        We look forward to connecting with you!
      </p>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <form action="https://api.web3forms.com/submit" method="POST">
              <!-- Replace with your Access Key -->
              <input type="hidden" name="access_key" value="7e09f262-005d-4471-b791-32196ea4d58b">

              <!-- Name -->
              <div class="form-floating mb-3">
                <input type="text" class="form-control rounded-3" id="name" name="name" placeholder="Your Name" required>
                <label for="name">Name</label>
              </div>

              <!-- Email -->
              <div class="form-floating mb-3">
                <input type="email" class="form-control rounded-3" id="email" name="email" placeholder="Your Email" required>
                <label for="email">Email</label>
              </div>

              <!-- Message -->
              <div class="form-floating mb-4">
                <textarea class="form-control rounded-3" id="message" name="message" placeholder="What's on your mind?" style="height: 150px" required></textarea>
                <label for="message">Message</label>
              </div>

              <!-- Honeypot Spam Protection -->
              <input type="checkbox" name="botcheck" class="d-none">

              <!-- Submit Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg rounded-3 shadow-sm">
                  Reach Out
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>


  <section class="py-5">
    <div class="container">
      <h2 class="mb-4 text-center">489 Winthrop Street, Medford, MA 02155, USA</h2>
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div style="position: relative;"><div style="position: relative; padding-bottom: 75%; height: 0; overflow: hidden;"><iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0; border-radius: var(--bs-border-radius-lg);" loading="lazy" allowfullscreen src="https://maps.google.com/maps?q=489+winthrop+street&output=embed"></iframe></div><a href="https://www.mileshilliard.com" rel="noopener" target="_blank" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;">www.mileshilliard.com</a></div>
        </div>
      </div>
    </div>
  </section>

{% endblock %}
